name: 'Lint Code'

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  lint_python:
    name: Lint & Auto-Fix Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
  
      - uses: actions/setup-python@v5
        with:
          python-version: 3.12
  
      - name: Install tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff black
  
      - name: Auto-fix with Ruff
        run: ruff check . --fix
  
      - name: Format with Black
        run: black .
  
      - name: Commit changes if needed
        run: |
          if [[ -n $(git status --porcelain) ]]; then
            git config --global user.name "github-actions"
            git config --global user.email "github-actions@github.com"
            git add .
            git commit -m "Auto-fix Python linting issues"
            git push
          fi
        
  lint_js:
    name: Lint & Auto-Fix JS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
  
      - uses: actions/setup-node@v4
        with:
          node-version: 20
  
      - name: Install ESLint
        run: |
          npm init -y
          npm install eslint --save-dev
          npx eslint --init
  
      - name: Auto-fix JavaScript
        run: npx eslint ./server/database --ext .js --fix
  
      - name: Commit changes if needed
        run: |
          if [[ -n $(git status --porcelain) ]]; then
            git config --global user.name "github-actions"
            git config --global user.email "github-actions@github.com"
            git add .
            git commit -m "Auto-fix JS linting issues"
            git push
          fi
